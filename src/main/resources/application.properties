# H2 in-memory database configuration
spring.datasource.url=jdbc:h2:file:./weatherdb_data
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration to automatically create tables
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenWeatherMap API Configuration
openweathermap.api.key=ea592292f3da67346cedca25cab4f32c
openweathermap.api.url=https://api.openweathermap.org/data/2.5/weather